services:
  kosit-validator:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    environment:
      KOSIT_VALIDATOR_TOKEN: ${KOSIT_VALIDATOR_TOKEN:?KOSIT_VALIDATOR_TOKEN is required}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

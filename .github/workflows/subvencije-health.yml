name: Subvencije health

# Independent uptime check for the funding module: no secrets, read-only checkout.
# GitHub notifications depend on the owner subscription settings. The public route
# returns only ok/status/alert codes (200 healthy, 503 alarm).
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: subvencije-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public funding health
        run: |
          for attempt in 1 2 3; do
            if node scripts/subvencije/check-public-health.cjs; then
              echo "Healthy or recovered"; exit 0
            fi
            echo "Attempt $attempt: health check failed"
            [ "$attempt" = 3 ] || sleep 60
          done
          echo "::error::Subvencije health check failed three times"
          exit 1

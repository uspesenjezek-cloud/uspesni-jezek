name: Openapi diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pos-openapi-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    if: ${{ vars.POS_OPENAPI_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .openapi-monitor-state
          key: openapi-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: openapi-alert-v1-
      - name: Check read-only Openapi diagnostics
        id: monitor
        env:
          POS_OPENAPI_DIAGNOSTICS_SECRET: ${{ secrets.POS_OPENAPI_DIAGNOSTICS_SECRET }}
          POS_OPENAPI_DIAGNOSTICS_RELEASE_VERIFIED: "true"
        run: node scripts/pos-openapi-monitor-notifications.js
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .openapi-monitor-state
          key: openapi-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report new diagnostic failure
        if: steps.monitor.outputs.exit_code != '0'
        run: exit 1

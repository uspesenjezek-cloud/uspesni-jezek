name: Openapi diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pos-openapi-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    if: ${{ vars.POS_OPENAPI_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check read-only Openapi diagnostics
        env:
          POS_OPENAPI_DIAGNOSTICS_SECRET: ${{ secrets.POS_OPENAPI_DIAGNOSTICS_SECRET }}
          POS_OPENAPI_DIAGNOSTICS_RELEASE_VERIFIED: "true"
        run: node scripts/pos-openapi-monitor.js

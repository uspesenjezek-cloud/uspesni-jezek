.trend-compare-switch{width:42px;height:23px;flex:none;display:flex;justify-content:flex-end;align-items:center;margin-left:auto;padding:3px;border-radius:99px;background:#8262d4}
.trend-compare-switch:after{content:"";width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #3b286230}
.trend-compare[aria-pressed=false]{background:#fff;color:#64718a;border-color:#e4e7f0}
.trend-compare[aria-pressed=false] .trend-compare-switch{background:#c9cedd;justify-content:flex-start}
.trend-legend{display:none;align-items:center;gap:20px;min-height:24px;margin:-4px 0 9px;padding-left:34px;font-size:15px;font-weight:650;line-height:1.2}
.trend-card.compared .trend-legend{display:flex}
.trend-legend span{display:inline-flex;align-items:center;gap:7px;min-width:0}
.trend-legend i{display:block;flex:none;width:11px;height:11px;border-radius:3px}
.trend-legend-current{color:#7659c9}
.trend-legend-current i{background:#9e80f3}
.trend-legend-prior{color:#348e88}
.trend-legend-prior i{background:#79c9c0}
.trend-plot{height:auto;align-items:flex-start}
.trend-scale{height:180px;flex:none}
.trend-chart-scroll{flex:1;min-width:0;overflow:hidden}
.trend-chart-inner{min-width:100%}
.trend-chart-inner .trend-bars{width:100%;height:180px}
.trend-chart-inner .trend-axis{margin:9px 0 0}
.trend-day-labels{display:none}
.trend-card.compared .trend-axis{display:none}
.trend-card.compared .trend-day-labels{display:flex;gap:12px;margin:9px 0 0;color:#75829a;font-size:12px;line-height:1.2}
.trend-day-labels span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.trend-card.compared .trend-chart-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-inline:contain;cursor:grab;user-select:none;-webkit-user-select:none}
.trend-card.compared .trend-chart-scroll.dragging{cursor:grabbing}
.trend-card.compared .trend-chart-inner{width:max(165%,var(--expanded-width))}
.trend-card.compared .trend-chart-scroll::-webkit-scrollbar{height:7px}
.trend-card.compared .trend-chart-scroll::-webkit-scrollbar-button{display:none;width:0;height:0}
.trend-card.compared .trend-chart-scroll::-webkit-scrollbar-thumb{border-radius:8px;background:#c2b3eb}
.trend-card.compared .trend-chart-scroll::-webkit-scrollbar-track{background:#f4f1fb}
.trend-card.compared .trend-bars{gap:12px}
.trend-bar .trend-prior-bar{display:none}
.trend-card.compared .trend-bar{gap:4px}
.trend-card.compared .trend-bar i{flex:1;min-width:0;width:auto}
.trend-card.compared .trend-bar .trend-prior-bar{display:block;height:var(--prior-height);background:linear-gradient(to top,#caeae5,#79c9c0)}
.trend-card.compared .trend-bar:hover .trend-prior-bar,.trend-card.compared .trend-bar:focus-visible .trend-prior-bar{background:linear-gradient(to top,#a9dcd5,#44a9a1)}
.dock{zoom:1;gap:3px;margin:4px 3px 0;padding:5px 4px;border:1px solid #dfebe9;border-radius:21px;background:#fff;box-shadow:0 -2px 12px #43605c10}
.dock button{min-width:0;min-height:53px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 2px;border-radius:17px;color:#64787c;font-size:9px;font-weight:650;letter-spacing:-.1px;line-height:1.05}
.dock button.active{background:#eaf7f4;color:#24565a;box-shadow:none}
.dock svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock .dock-label{display:block;max-width:100%;text-align:center;white-space:nowrap}
@media(max-width:360px){.dock .dock-label{white-space:normal}}
</style></html>

<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f7f3">
  <title>Slovenski live prepis · Uspešni Ježek</title>
  <link rel="stylesheet" href="slovenski-prepis.css?v=20260825-v1">
</head>
<body>
  <main class="prepis-stage">
    <section class="prepis-widget" aria-labelledby="prepis-title">
      <header class="prepis-header">
        <div class="prepis-brand">
          <span class="prepis-brand__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M6.5 11.5v.5a5.5 5.5 0 0 0 11 0v-.5M12 17.5V21M9.5 21h5"/></svg>
          </span>
          <div>
            <p class="prepis-eyebrow">PREPIS V ŽIVO</p>
            <h1 id="prepis-title">Slovenski prepis</h1>
          </div>
        </div>
        <span class="prepis-status" id="prepis-status" data-state="loading"><i></i><span>Nalaganje modela</span></span>
      </header>
      <div class="prepis-source" aria-label="Vir zvoka">
        <button type="button" data-audio-source="microphone" aria-pressed="true">Mikrofon</button>
        <button type="button" data-audio-source="computer" aria-pressed="false">Zvok računalnika</button>
      </div>
      <div class="prepis-visual" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="prepis-output" id="prepis-output" role="log" aria-live="polite" aria-label="Prepis pogovora">
        <p class="prepis-placeholder" id="prepis-placeholder">Ko je model pripravljen, pritisnite Začni in govorite naravno.</p>
        <div id="prepis-final"></div>
        <p class="prepis-partial" id="prepis-partial"></p>
      </div>
      <p class="prepis-error" id="prepis-error" role="alert" hidden></p>
      <div class="prepis-actions">
        <button class="prepis-primary" id="prepis-toggle" type="button" disabled><span class="prepis-primary__dot"></span><span id="prepis-toggle-label">Začni prepis</span></button>
        <button class="prepis-icon-button" id="prepis-copy" type="button" aria-label="Kopiraj prepis" title="Kopiraj prepis">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        </button>
        <button class="prepis-icon-button" id="prepis-clear" type="button" aria-label="Izbriši prepis" title="Izbriši prepis">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>
        </button>
      </div>
      <footer class="prepis-footer">
        <span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Zvok ostaja na tem računalniku</span>
        <span id="prepis-backend">sl-SI</span>
      </footer>
    </section>
  </main>
  <script src="slovenski-prepis.js?v=20260825-canary-progressive-v17"></script>
</body>
</html>

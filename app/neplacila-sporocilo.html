<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sporočilo dolžniku – Uspešni Jezek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3d7676" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-zascita.js"></script>
  </head>
  <body>
    <header class="app__header">
      <a class="app__nazaj" href="neplacila.html#obrazec">← Nazaj</a>
      <h1 class="app__naslov-podstrani">Sporočilo dolžniku</h1>
    </header>

    <main class="app__vsebina">
      <p class="obrazec__napaka" id="splosna-napaka" hidden></p>

      <section class="dodaj-zadevo" aria-label="Napiši sporočilo dolžniku">
        <h2 class="seznam-zadev__naslov">Zadnji korak: sporočilo dolžniku</h2>
        <form class="obrazec" id="obrazec-sporocilo">
          <fieldset class="zadeva-obrazec__sklop">
            <legend class="zadeva-obrazec__sklop-naslov">Sporočilo</legend>

            <div class="obrazec__polje">
              <label id="predlogi-naslov">Predlogi sporočila</label>

              <div class="sporocilo-predlogi-gumbi">
                <button
                  type="button"
                  class="btn btn--obris btn--majhen"
                  id="gumb-dodaj-predlog"
                >
                  + Dodaj predlog
                </button>
                <button
                  type="button"
                  class="btn btn--obris btn--majhen"
                  id="gumb-uredi-predlog"
                >
                  Uredi
                </button>
              </div>

              <div class="sporocilo-nov-predlog" id="nov-predlog-obrazec" hidden>
                <input
                  type="text"
                  id="nov-predlog-besedilo"
                  placeholder="Novo besedilo predloga ..."
                  aria-label="Besedilo novega predloga"
                />
                <button
                  type="button"
                  class="sporocilo-nov-predlog__gumb sporocilo-nov-predlog__gumb--shrani"
                  id="gumb-shrani-predlog"
                  aria-label="Shrani predlog"
                >
                  ✓
                </button>
                <button
                  type="button"
                  class="sporocilo-nov-predlog__gumb sporocilo-nov-predlog__gumb--preklici"
                  id="gumb-preklici-predlog"
                  aria-label="Prekliči dodajanje predloga"
                >
                  ✕
                </button>
              </div>

              <div
                class="sporocilo-predlogi-seznam"
                id="predlogi-seznam"
                role="group"
                aria-labelledby="predlogi-naslov"
              >
                <!-- Sem app.js izriše predloge iz baze -->
              </div>
            </div>

            <div class="obrazec__polje obrazec__polje--sporocilo-besedilo">
              <label for="sporocilo-besedilo">Sporočilo za dolžnika</label>
              <textarea
                id="sporocilo-besedilo"
                name="sporocilo"
                rows="9"
                placeholder="Napiši sporočilo ali izberi enega od predlogov zgoraj ..."
              ></textarea>
            </div>

            <div class="obrazec__polje">
              <label id="predlogi-placilo-naslov">Možnosti plačila</label>

              <div class="sporocilo-predlogi-gumbi">
                <button
                  type="button"
                  class="btn btn--obris btn--majhen"
                  id="gumb-dodaj-predlog-placilo"
                >
                  + Dodaj možnost plačila
                </button>
                <button
                  type="button"
                  class="btn btn--obris btn--majhen"
                  id="gumb-uredi-predlog-placilo"
                >
                  Uredi
                </button>
              </div>

              <div class="sporocilo-nov-predlog" id="nov-predlog-placilo-obrazec" hidden>
                <input
                  type="text"
                  id="nov-predlog-placilo-besedilo"
                  placeholder="Nova možnost plačila ..."
                  aria-label="Besedilo nove možnosti plačila"
                />
                <button
                  type="button"
                  class="sporocilo-nov-predlog__gumb sporocilo-nov-predlog__gumb--shrani"
                  id="gumb-shrani-predlog-placilo"
                  aria-label="Shrani možnost plačila"
                >
                  ✓
                </button>
                <button
                  type="button"
                  class="sporocilo-nov-predlog__gumb sporocilo-nov-predlog__gumb--preklici"
                  id="gumb-preklici-predlog-placilo"
                  aria-label="Prekliči dodajanje možnosti plačila"
                >
                  ✕
                </button>
              </div>

              <div
                class="sporocilo-predlogi-seznam"
                id="predlogi-placilo-seznam"
                role="group"
                aria-labelledby="predlogi-placilo-naslov"
              >
                <!-- Sem app.js izriše predloge iz baze -->
              </div>
            </div>
          </fieldset>

          <button type="submit" class="btn btn--cta">Dodaj zadevo</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

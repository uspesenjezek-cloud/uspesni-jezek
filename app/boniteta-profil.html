<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Odpiram bonitetni center – Uspešni Ježek</title>
    <script>
      (function () {
        var current = new URL(window.location.href);
        var profileId = current.searchParams.get("id") || current.searchParams.get("profile") || "";
        var section = current.hash.replace(/^#/, "");
        var target = new URL("bonitetna-preverba.html", current);
        if (profileId) target.searchParams.set("profile", profileId);
        if (section) target.searchParams.set("section", section);
        target.hash = "new";
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body></body>
</html>

<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prijava – Uspešni Jezek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260814-auto-fit-pill-v36" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3d7676" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="sentry.bundle.js?v=20260816-sentry-v1"></script>
    <script src="supabase-client.js"></script>
  </head>
  <body>
    <header class="app__header">
      <div class="app__logo-vrstica">
        <span class="app__logo-mark" aria-hidden="true"></span>
        <span class="app__logo-text">Uspešni Jezek</span>
      </div>
      <p class="app__podnapis">Vaš delovni portal</p>
    </header>

    <main class="app__vsebina">
      <section class="kartica">
        <h1 class="kartica__naslov" id="prijava-naslov">Prijava</h1>

        <form class="obrazec" id="obrazec-prijava">
          <div class="obrazec__polje" id="polje-ime-podjetja" hidden>
            <label for="ime-podjetja">Ime obrtnika / podjetja</label>
            <input type="text" id="ime-podjetja" name="imePodjetja" />
          </div>

          <div class="obrazec__polje">
            <label for="email">E-pošta</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="obrazec__polje">
            <label for="geslo">Geslo</label>
            <input
              type="password"
              id="geslo"
              name="geslo"
              required
              minlength="6"
            />
          </div>

          <p class="obrazec__napaka" id="obrazec-napaka" hidden></p>
          <p class="obrazec__sporocilo" id="obrazec-sporocilo" hidden></p>

          <button type="submit" class="btn btn--cta" id="gumb-poslji">
            Prijava
          </button>
        </form>

        <p class="prijava-preklop">
          <span id="preklop-besedilo">Nimaš še računa?</span>
          <a href="#" id="preklop-povezava">Registracija</a>
        </p>
      </section>
    </main>

    <script src="prijava.js"></script>
  </body>
</html>

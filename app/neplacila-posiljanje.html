<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Načrt opominjanja – Uspešni Jezek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260808-opomin-nacrt" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#51999a" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-zascita.js"></script>
  </head>
  <body class="stran--sporocilo">
    <div class="korak2-ovoj wizard-shell">
      <div class="wizard-topbar">
        <a class="wizard-topbar__nazaj" href="neplacila-sporocilo.html">
          <span aria-hidden="true">←</span>
          Nazaj
        </a>
        <button type="button" class="wizard-topbar__izbrisi" id="gumb-izbrisi-osnutek">
          Izbriši osnutek
        </button>
      </div>

    <div class="korak2">
      <div data-wizard-progress-header data-korak="3">
        <nav class="debt-stepper" data-koraki-postopek aria-label="Koraki postopka">
          <a href="neplacila.html#obrazec" class="debt-step" data-korak="1" aria-label="1 od 3: Vnos dolžnika">
            <span class="debt-step__content">
              <span class="debt-step__number" aria-hidden="true">1</span>
              <span class="debt-step__label">Dolžnik</span>
            </span>
            <span class="debt-step__line" aria-hidden="true"></span>
          </a>
          <a href="neplacila-sporocilo.html" class="debt-step" data-korak="2" aria-label="2 od 3: Vnos sporočila">
            <span class="debt-step__content">
              <span class="debt-step__number" aria-hidden="true">2</span>
              <span class="debt-step__label">Sporočilo</span>
            </span>
            <span class="debt-step__line" aria-hidden="true"></span>
          </a>
          <a href="neplacila-posiljanje.html" class="debt-step" data-korak="3" aria-label="3 od 3: Pošiljanje">
            <span class="debt-step__content">
              <span class="debt-step__number" aria-hidden="true">3</span>
              <span class="debt-step__label">Pošiljanje</span>
            </span>
            <span class="debt-step__line" aria-hidden="true"></span>
          </a>
        </nav>
        <header class="korak-glava wizard-current-header">
          <div class="korak-glava__levo">
            <span class="korak-glava__ikona" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </span>
            <div class="korak-glava__besedilo">
              <p class="korak-glava__meta">Korak 3 od 3</p>
              <h2 class="korak-glava__naslov">Načrt opominjanja</h2>
            </div>
          </div>
          <p class="korak-glava__osnutek" id="osnutek-status" role="status" aria-live="polite">Osnutek shranjen</p>
        </header>
      </div>

      <main class="korak2__vsebina">
        <p class="obrazec__napaka" id="splosna-napaka" hidden></p>

        <section class="priloga-posiljanje-info" id="priloga-posiljanje-info" hidden>
          <h2 class="priloga-posiljanje-info__naslov">Račun za pošiljanje</h2>
          <div class="priloga-posiljanje-info__kanali" id="priloga-posiljanje-kanali" hidden>
            <label class="priloga-posiljanje-info__kanal">
              <input type="radio" name="kanal-posiljanja" value="email" id="kanal-email" />
              E-pošta
            </label>
            <label class="priloga-posiljanje-info__kanal">
              <input type="radio" name="kanal-posiljanja" value="sms" id="kanal-sms" />
              SMS
            </label>
          </div>
          <p class="priloga-posiljanje-info__besedilo" id="priloga-posiljanje-besedilo" role="status"></p>
        </section>

        <!-- Glavni zaslon načrta (JS) -->
        <div id="opomin-nacrt-glavni" class="opomin-nacrt"></div>

        <!-- Potrditveni zaslon za en SMS korak (JS) -->
        <div id="opomin-nacrt-potrditev" class="opomin-nacrt-potrdi" hidden></div>
      </main>
    </div>
    </div>

    <script src="ton-dodatki-priporocila.js"></script>
    <script src="gsm7-stevec.js"></script>
    <script src="opomin-nacrt.js"></script>
    <script src="opomin-nacrt-ui.js"></script>
    <script src="app.js?v=20260808-opomin-nacrt"></script>
  </body>
</html>

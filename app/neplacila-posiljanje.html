<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nastavi pošiljanje – Uspešni Jezek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260808-hash-sidro" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4d9494" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-zascita.js"></script>
  </head>
  <body class="stran--sporocilo">
    <div class="korak2-ovoj wizard-shell">
      <div class="wizard-topbar">
        <a class="wizard-topbar__nazaj" href="neplacila-sporocilo.html">
          <span aria-hidden="true">←</span>
          Nazaj
        </a>
        <button type="button" class="wizard-topbar__izbrisi" id="gumb-izbrisi-osnutek">
          Izbriši osnutek
        </button>
      </div>

    <div class="korak2">
      <div data-wizard-progress-header data-korak="3"></div>

      <main class="korak2__vsebina">
        <p class="obrazec__napaka" id="splosna-napaka" hidden></p>

        <div class="korak2__naslov-vrstica">
          <div>
            <h1 class="korak2__naslov">Nastavi pošiljanje</h1>
            <p class="korak2__podnaslov">
              Nastavitev časa in načina samodejnega pošiljanja SMS-sporočil pride v naslednji različici.
            </p>
          </div>
          <span class="korak2__oznaka">3 od 3</span>
        </div>

        <p class="korak2__info" style="display: block; margin-bottom: 24px;">
          Za zdaj lahko zadevo shranite z že sestavljenim sporočilom. Urnik pošiljanja bomo dodali kmalu.
        </p>

        <section class="priloga-posiljanje-info" id="priloga-posiljanje-info" hidden>
          <h2 class="priloga-posiljanje-info__naslov">Račun za pošiljanje</h2>
          <div class="priloga-posiljanje-info__kanali" id="priloga-posiljanje-kanali" hidden>
            <label class="priloga-posiljanje-info__kanal">
              <input type="radio" name="kanal-posiljanja" value="email" id="kanal-email" />
              E-pošta
            </label>
            <label class="priloga-posiljanje-info__kanal">
              <input type="radio" name="kanal-posiljanja" value="sms" id="kanal-sms" />
              SMS
            </label>
          </div>
          <p class="priloga-posiljanje-info__besedilo" id="priloga-posiljanje-besedilo" role="status"></p>
        </section>

        <form id="obrazec-posiljanje">
          <button type="submit" class="korak2__gumb-naprej" id="gumb-shrani-zadevo">
            Shrani zadevo
          </button>
        </form>
      </main>
    </div>
    </div>

    <script src="app.js?v=20260808-wizard-header"></script>
  </body>
</html>
